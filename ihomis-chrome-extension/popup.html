<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 800;
      background: #059669;
      color: white;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    .label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }
    .value {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 2px;
    }
    .link {
      display: block;
      text-align: center;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">LIVE SYNC</div>
    <div class="title">CPHB iHOMIS+ Bridge</div>
  </div>

  <div class="card">
    <div class="label">Last Synced Status</div>
    <div class="value" id="syncStatus">Monitoring iHOMIS...</div>
    <div style="font-size: 10px; color: #64748b; margin-top: 4px;" id="syncTime">Auto-syncs every 10s</div>
  </div>

  <a href="https://cphb-emergency-alert.vercel.app" target="_blank" class="link">
    Open Emergency Dashboard 🚀
  </a>

  <script src="popup.js"></script>
</body>
</html>
