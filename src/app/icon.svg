<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Border Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#60a5fa" stroke-width="8" stroke-opacity="0.5" />

  <!-- Medical Cross Glow -->
  <g filter="url(#glow)">
    <!-- Red Emergency Cross Background Symbol -->
    <rect x="216" y="96" width="80" height="320" rx="20" fill="#ffffff" fill-opacity="0.15" />
    <rect x="96" y="216" width="320" height="80" rx="20" fill="#ffffff" fill-opacity="0.15" />

    <!-- Sharp White Heartbeat ECG Pulse Line -->
    <path 
      d="M 64 256 L 150 256 L 190 140 L 245 372 L 295 180 L 335 290 L 365 256 L 448 256" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Emergency Beacon Indicator Dot -->
    <circle cx="395" cy="125" r="32" fill="#ef4444" stroke="#ffffff" stroke-width="8" />
  </g>
</svg>
